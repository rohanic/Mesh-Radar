name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci --passWithNoTests

  core:
    name: Kotlin mesh core and simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Core tests (protocol, crypto, routing, engine, 500-phone simulator)
        working-directory: modules/mesh-engine/core
        run: gradle test --no-daemon
      - name: Simulator report
        if: always()
        run: cat modules/mesh-engine/core/build/simulator-report.txt || true

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-radar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
