name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:copy
      - run: npm run check:i18n
      - run: npm run check:secrets
      - run: npm run test:coverage -- --ci

  worker:
    name: Worker typecheck and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      # The Worker imports shared engine code (and zod) from the app, so both installs are needed.
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm run check
        working-directory: worker
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: worker

  core:
    name: Kotlin mesh core and simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Core tests (protocol, crypto, routing, engine, 500-phone simulator)
        working-directory: modules/mesh-engine/core
        run: gradle test --no-daemon
      - name: Simulator report
        if: always()
        run: cat modules/mesh-engine/core/build/simulator-report.txt || true

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Native builds (Skia, Reanimated, Worklets) need more disk than a stock runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" && df -h /
      # Parallel clang jobs plus the Gradle and Kotlin daemons can exhaust the runner's memory,
      # which shows up as "The runner has received a shutdown signal". Extra swap absorbs peaks.
      - name: Add swap
        run: |
          sudo fallocate -l 10G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install
      - name: Assemble debug APK
        working-directory: android
        # One ABI and two workers keep the check build inside the runner's memory; release bundles
        # build all four ABIs on EAS. Memory is logged each minute in case the runner is lost.
        run: |
          (while true; do free -m | awk 'NR==2 {print "[mem] used " $3 " MB of " $2 " MB"}'; sleep 60; done) &
          ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-radar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
